<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAFI - Test KYC Clean</title>
    <style>
        body {
            margin: 0;
            background: #121214;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .box {
            background: #18181b;
            border: 2px solid #10b981;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            width: 320px;
        }
        h2 { color: #10b981; margin-top: 0; }
        .btn {
            background: #10b981;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="box">
        <h2>🛡️ KYC Halaman Bersih</h2>
        <p>Jika halaman ini tampil, berarti file fisik dan rute server sudah 100% normal tanpa terhalang apa pun.</p>
        <button class="btn" onclick="window.location.href='/profile'">Kembali ke Profile</button>
    </div>
</body>
</html>
