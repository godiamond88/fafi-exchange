<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAFI - KYC & Bank Verification</title>
    <style>
        body {
            margin: 0;
            background: #121214;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Ukuran Frame disamakan persis dengan ukuran Reels (380px x 720px) */
        .phone-frame {
            position: relative;
            width: 380px;
            height: 720px;
            background: #09090b;
            border-radius: 20px;
            border: 2px solid #27272a;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            overflow: hidden;
        }

        /* Konten Utama (Bisa di-scroll) */
        .container {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            box-sizing: border-box;
            padding-bottom: 75px;
        }

        .container::-webkit-scrollbar {
            width: 4px;
        }
        .container::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 4px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #27272a;
            padding-bottom: 10px;
            margin-bottom: 12px;
            font-weight: bold;
            font-size: 13px;
        }

        .close-btn {
            background: #27272a;
            border: none;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .close-btn:hover { background: #10b981; color: #000; }

        .section-title {
            font-size: 10.5px;
            font-weight: bold;
            color: #10b981;
            text-transform: uppercase;
            margin: 12px 0 8px 0;
            letter-spacing: 0.5px;
            border-bottom: 1px solid #18181b;
            padding-bottom: 4px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 10px;
        }

        .form-label {
            font-size: 10px;
            color: #a1a1aa;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 8px;
            padding: 9px 12px;
            color: #fff;
            font-size: 11.5px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .form-input:focus { border-color: #10b981; }
        .form-input:read-only {
            background: #121214;
            color: #71717a;
            border-color: #18181b;
            cursor: not-allowed;
        }

        .submit-btn {
            width: 100%;
            background: #10b981;
            color: #000;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            margin-top: 14px;
            box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
            transition: opacity 0.2s;
        }
        .submit-btn:hover { opacity: 0.9; }

        /* Navbar Bawah Konsisten */
        .bottom-nav {
            height: 60px;
            background: #09090b;
            border-top: 1px solid #27272a;
            display: flex;
            justify-content: space-around;
            align-items: center;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            box-sizing: border-box;
            z-index: 10;
        }

        .nav-item {
            color: #71717a;
            text-decoration: none;
            font-size: 9px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .nav-item.active { color: #f59e0b; font-weight: bold; }
        .nav-item:hover { color: #fff; }
        .nav-item span.icon { font-size: 16px; }
    </style>
</head>
<body>
    <div class="phone-frame">
        <div class="container">
            <div class="header">
                <span style="color: #10b981;">🛡️ KYC &amp; Bank Verification</span>
                <button class="close-btn" onclick="window.location.href='/profile'">&times;</button>
            </div>

            <div class="form-group">
                <label class="form-label">User Name (Locked)</label>
                <input type="text" class="form-input" id="kycUsername" value="ryank_creative" readonly>
            </div>

            <div class="form-group">
                <label class="form-label">No NIK</label>
                <input type="text" class="form-input" id="kycNik" placeholder="Enter 16-digit NIK KTP" maxlength="16">
            </div>

            <div class="form-group">
                <label class="form-label">Nama (Sesuai KTP)</label>
                <input type="text" class="form-input" id="kycName" value="Rian Rawalangi">
            </div>

            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-input" id="kycEmail" value="rian.rawalangi@gmail.com">
            </div>

            <div class="form-group">
                <label class="form-label">No HP</label>
                <input type="text" class="form-input" id="kycPhone" placeholder="e.g. 08123456789">
            </div>

            <div class="form-group">
                <label class="form-label">Alamat</label>
                <input type="text" class="form-input" id="kycAddress" placeholder="Enter residential address">
            </div>

            <div class="section-title">Data Bank</div>

            <div class="form-group">
                <label class="form-label">No Rekening</label>
                <input type="text" class="form-input" id="kycAccount" placeholder="Masukkan nomor rekening" oninput="autoDetectBank(this.value)">
            </div>

            <div class="form-group">
                <label class="form-label">Bank</label>
                <input type="text" class="form-input" id="kycBank" placeholder="Terdeteksi otomatis..." readonly style="color: #22d3ee; font-weight: bold;">
            </div>

            <div class="form-group">
                <label class="form-label">Nama Di Rekening (Auto)</label>
                <input type="text" class="form-input" id="kycBankName" placeholder="Terdeteksi otomatis..." readonly style="color: #f59e0b; font-weight: bold;">
            </div>

            <button class="submit-btn" onclick="submitKycData()">Submit</button>
        </div>

        <div class="bottom-nav">
            <a href="/" class="nav-item"><span class="icon">🏠</span><span>Home</span></a>
            <a href="/trading" class="nav-item"><span class="icon">📈</span><span>Trading</span></a>
            <a href="/reels" class="nav-item"><span class="icon">🔥</span><span>Reels</span></a>
            <a href="/wallet" class="nav-item"><span class="icon">👛</span><span>Wallet</span></a>
            <a href="/profile" class="nav-item active"><span class="icon">👤</span><span>Profile</span></a>
        </div>
    </div>

    <script>
        function autoDetectBank(accNo) {
            const bankField = document.getElementById('kycBank');
            const nameField = document.getElementById('kycBankName');
            const fullName = document.getElementById('kycName').value;

            if (accNo.length >= 4) {
                if (accNo.startsWith('1')) {
                    bankField.value = "Bank BCA";
                } else if (accNo.startsWith('2')) {
                    bankField.value = "Bank Mandiri";
                } else if (accNo.startsWith('3')) {
                    bankField.value = "Bank BNI";
                } else {
                    bankField.value = "Bank BRI";
                }
                nameField.value = fullName.toUpperCase();
            } else {
                bankField.value = "";
                nameField.value = "";
            }
        }

        function submitKycData() {
            const nik = document.getElementById('kycNik').value;
            const account = document.getElementById('kycAccount').value;
            
            if (!nik || nik.length < 16) {
                alert('Mohon masukkan No NIK 16 digit yang valid.');
                return;
            }
            if (!account) {
                alert('Mohon masukkan nomor rekening bank.');
                return;
            }

            const savedUser = localStorage.getItem('faFiUserData');
            let userData = savedUser ? JSON.parse(savedUser) : { username: "ryank_creative" };
            userData.kycVerified = true;
            userData.nik = nik;
            localStorage.setItem('faFiUserData', JSON.stringify(userData));

            alert('KYC Berhasil Disubmit!');
            window.location.href = '/profile';
        }
    </script>
</body>
</html>
