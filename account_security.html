<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAFI - Account Security & 2FA</title>
    <style>
        body {
            margin: 0;
            background: #121214;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
        }

        /* Ukuran Frame dikunci standar 380px x 720px */
        .container {
            position: relative;
            width: 380px;
            height: 720px;
            background: #09090b;
            color: #fff;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8);
            border: 2px solid #27272a;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .content-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            box-sizing: border-box;
            padding-bottom: 75px;
        }

        .content-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .content-scroll::-webkit-scrollbar-thumb {
            background: #27272a;
            border-radius: 4px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #27272a;
            padding-bottom: 10px;
            margin-bottom: 14px;
            font-weight: bold;
            font-size: 13px;
        }

        .close-btn {
            background: #27272a;
            border: none;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }
        .close-btn:hover { background: #eab308; color: #000; }

        .section-title {
            font-size: 10px;
            font-weight: bold;
            color: #a1a1aa;
            text-transform: uppercase;
            margin: 12px 0 6px 0;
            letter-spacing: 0.5px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 10px;
        }

        .form-label {
            font-size: 9.5px;
            color: #a1a1aa;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 8px;
            padding: 9px 12px;
            color: #fff;
            font-size: 11px;
            outline: none;
            width: 100%;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .form-input:focus { border-color: #eab308; }

        .action-btn {
            width: 100%;
            background: #eab308;
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 10px;
            font-weight: 800;
            font-size: 11px;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 4px 15px rgba(234, 179, 8, 0.2);
            transition: opacity 0.2s;
        }
        .action-btn:hover { opacity: 0.9; }

        .security-card {
            background: #18181b;
            border: 1px solid #27272a;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .sec-info-title { font-size: 11.5px; font-weight: bold; color: #fff; }
        .sec-info-desc { font-size: 9px; color: #a1a1aa; margin-top: 2px; }

        /* Switch Toggle */
        .switch {
            position: relative;
            display: inline-block;
            width: 36px;
            height: 20px;
        }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: #27272a; transition: .3s; border-radius: 20px;
        }
        .slider:before {
            position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: #10b981; }
        input:checked + .slider:before { transform: translateX(16px); }

        /* Navbar Bawah Konsisten */
        .bottom-nav {
            height: 60px;
            background: #09090b;
            border-top: 1px solid #27272a;
            display: flex;
            justify-content: space-around;
            align-items: center;
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            box-sizing: border-box;
            z-index: 20;
        }

        .nav-item {
            color: #71717a;
            text-decoration: none;
            font-size: 9px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }
        .nav-item.active { color: #f59e0b; font-weight: bold; }
        .nav-item:hover { color: #fff; }
        .nav-item span.icon { font-size: 16px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="content-scroll">
            <div class="header">
                <span style="color: #eab308;">🔒 Account Security &amp; 2FA</span>
                <button class="close-btn" onclick="window.location.href='/profile'">&times;</button>
            </div>

            <!-- Bagian Bind TRC20 Address -->
            <div class="section-title">TRC20 Wallet Binding</div>
            <div class="form-group">
                <label class="form-label">TRC20 Withdrawal Address</label>
                <input type="text" class="form-input" id="trc20AddressInput" placeholder="Enter TRC20 wallet address (e.g. T...)">
            </div>
            <button class="action-btn" onclick="saveTrc20Address()">Save TRC20 Address</button>

            <!-- Bagian Ubah Password -->
            <div class="section-title" style="margin-top: 16px;">Change Password</div>
            <div class="form-group">
                <label class="form-label">Current Password</label>
                <input type="password" class="form-input" id="currentPass" placeholder="••••••••">
            </div>
            <div class="form-group">
                <label class="form-label">New Password</label>
                <input type="password" class="form-input" id="newPass" placeholder="••••••••">
            </div>
            <button class="action-btn" style="background: #10b981;" onclick="updatePassword()">Update Password</button>

            <!-- Bagian Keamanan Lainnya -->
            <div class="section-title" style="margin-top: 16px;">Security Preferences</div>
            
            <div class="security-card">
                <div>
                    <div class="sec-info-title">Google Authenticator (2FA)</div>
                    <div class="sec-info-desc">Require 2FA code on login & withdrawal</div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="toggle2fa" onchange="toggleSecurity('2FA', this.checked)">
                    <span class="slider"></span>
                </label>
            </div>

            <div class="security-card">
                <div>
                    <div class="sec-info-title">Login Email Alerts</div>
                    <div class="sec-info-desc">Notify on new device logins</div>
                </div>
                <label class="switch">
                    <input type="checkbox" id="toggleEmailAlert" checked onchange="toggleSecurity('Email Alert', this.checked)">
                    <span class="slider"></span>
                </label>
            </div>
        </div>

        <!-- Navbar Bawah Konsisten -->
        <div class="bottom-nav">
            <a href="/" class="nav-item"><span class="icon">🏠</span><span>Home</span></a>
            <a href="/trading" class="nav-item"><span class="icon">📈</span><span>Trading</span></a>
            <a href="/reels" class="nav-item"><span class="icon">🔥</span><span>Reels</span></a>
            <a href="/wallet" class="nav-item"><span class="icon">👛</span><span>Wallet</span></a>
            <a href="/profile" class="nav-item active"><span class="icon">👤</span><span>Profile</span></a>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const savedWallet = JSON.parse(localStorage.getItem('fafiUserWallet')) || {};
            if (savedWallet.trc20Address) {
                document.getElementById('trc20AddressInput').value = savedWallet.trc20Address;
            }
        });

        function saveTrc20Address() {
            const addr = document.getElementById('trc20AddressInput').value.trim();
            if (!addr.startsWith('T') || addr.length < 30) {
                alert("❌ Masukkan alamat TRC20 yang valid (diawali huruf T).");
                return;
            }

            let walletData = JSON.parse(localStorage.getItem('fafiUserWallet')) || { faraBalance: 1250.00, usdtBalance: 1000.00 };
            walletData.trc20Address = addr;
            localStorage.setItem('fafiUserWallet', JSON.stringify(walletData));

            alert("✅ Alamat TRC20 berhasil di-binding ke akun Anda!");
        }

        function updatePassword() {
            const curr = document.getElementById('currentPass').value;
            const neo = document.getElementById('newPass').value;

            if (!curr || !neo) {
                alert("❌ Mohon isi password lama dan password baru.");
                return;
            }
            if (neo.length < 6) {
                alert("❌ Password baru minimal harus 6 karakter.");
                return;
            }

            alert("✅ Password berhasil diperbarui!");
            document.getElementById('currentPass').value = '';
            document.getElementById('newPass').value = '';
        }

        function toggleSecurity(feature, status) {
            alert(`ℹ️ Fitur ${feature} berhasil di-${status ? 'aktifkan' : 'nonaktifkan'}.`);
        }
    </script>
</body>
</html>
