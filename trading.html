<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAFI Trading - FARA/USDT Spot</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #121212; color: #e0e0e0; margin: 0; padding: 0; padding-bottom: 70px; user-select: none; }
        header { background: #1a1a1a; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2a2a2a; }
        
        .page-section { max-width: 520px; margin: auto; padding: 10px; }
        .trade-header { background: #1e1e1e; padding: 12px 15px; border-radius: 8px; border: 1px solid #2a2a2a; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 0.9em; }
        
        /* Grafik Simulasi Candlestick */
        .chart-box { background: #181818; border: 1px solid #2a2a2a; border-radius: 8px; padding: 15px; margin-bottom: 10px; text-align: center; }
        .timeframes { display: flex; gap: 8px; margin-bottom: 10px; }
        .tf-btn { background: #222; border: none; color: #888; padding: 4px 8px; border-radius: 4px; font-size: 0.75em; cursor: pointer; }
        .tf-btn.active { background: #333; color: #00ffcc; }
        
        .candlestick-area { height: 160px; display: flex; align-items: flex-end; justify-content: space-around; padding-top: 10px; border-bottom: 1px solid #2a2a2a; border-left: 1px solid #2a2a2a; position: relative; margin-bottom: 10px; }
        .candle { width: 6px; position: relative; border-radius: 2px; }
        .candle.green { background: #00ff88; }
        .candle.green::before { content:''; position: absolute; top: -6px; left: 2px; width: 2px; height: calc(100% + 12px); background: #00ff88; }
        .candle.red { background: #ff4d4d; }
        .candle.red::before { content:''; position: absolute; top: -6px; left: 2px; width: 2px; height: calc(100% + 12px); background: #ff4d4d; }

        /* Panel Beli / Jual */
        .trade-panel { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
        .panel-box { background: #1e1e1e; padding: 12px; border-radius: 8px; border: 1px solid #2a2a2a; font-size: 0.85em; }
        
        .tab-switch { display: flex; background: #121212; border-radius: 6px; padding: 3px; margin-bottom: 10px; gap: 4px; }
        .tab-btn { flex: 1; text-align: center; padding: 6px; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 0.8em; color: #888; }
        .tab-btn.buy.active { background: #00ff88; color: #121212; }
        .tab-btn.sell.active { background: #ff4d4d; color: #fff; }

        .input-group { margin-bottom: 8px; }
        .input-group label { display: block; font-size: 0.7em; color: #888; margin-bottom: 2px; }
        .input-box { background: #121212; border: 1px solid #333; border-radius: 6px; padding: 6px 8px; display: flex; justify-content: space-between; align-items: center; color: #fff; font-size: 0.8em; }
        .input-box input { background: transparent; border: none; color: #fff; width: 100%; outline: none; font-size: 0.9em; }

        .action-btn { width: 100%; padding: 8px; border: none; border-radius: 6px; font-weight: bold; font-size: 0.85em; cursor: pointer; margin-top: 5px; }
        .action-btn.buy { background: #00ff88; color: #121212; }
        .action-btn.sell { background: #ff4d4d; color: #fff; }

        /* Order Book Sederhana */
        .orderbook-item { display: flex; justify-content: space-between; font-size: 0.75em; padding: 2px 0; }
        
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #181818; border-top: 1px solid #2a2a2a; display: flex; justify-content: space-around; padding: 8px 0; z-index: 100; }
        .nav-item { text-align: center; color: #888; font-size: 0.7em; text-decoration: none; cursor: pointer; flex: 1; }
        .nav-item.active { color: #00ffcc; }
        .nav-item div { font-size: 1.1em; margin-bottom: 2px; }
    </style>
</head>
<body>
    <header>
        <div style="font-weight: bold; color: #00ffcc;">⚡ FAFI Exchange</div>
        <div style="font-size: 0.75em; color: #888;">Master Wallet: <span style="color:#00ffcc;">TTip6T1...xCxy</span></div>
    </header>

    <div class="page-section">
        <!-- Header Pair -->
        <div class="trade-header">
            <div>
                <span style="font-weight: bold; font-size: 1.1em; color: #fff;">FARA/USDT</span>
                <span style="background: #1a3a2a; color: #00ff88; padding: 2px 6px; border-radius: 4px; font-size: 0.75em; margin-left: 6px;">Spot</span>
            </div>
            <div style="text-align: right;">
                <div style="font-weight: bold; font-size: 1.1em; color: #00ff88;" id="currentPrice">1.5000</div>
                <div style="font-size: 0.75em; color: #00ff88;">+4.15%</div>
            </div>
        </div>

        <!-- Grafik Candlestick -->
        <div class="chart-box">
            <div class="timeframes">
                <button class="tf-btn">15m</button>
                <button class="tf-btn active">1H</button>
                <button class="tf-btn">4H</button>
                <button class="tf-btn">1D</button>
            </div>
            <div class="candlestick-area" id="candleContainer">
                <!-- Dihasilkan otomatis via JS -->
            </div>
            <div style="font-size: 0.75em; color: #888; display: flex; justify-content: space-between;">
                <span>High: <strong style="color:#fff;">1.5500</strong></span>
                <span>Low: <strong style="color:#fff;">1.4500</strong></span>
                <span>Vol FARA: <strong style="color:#00ffcc;">1,245,890</strong></span>
            </div>
        </div>

        <!-- Panel Order & Order Book -->
        <div class="trade-panel">
            <!-- Panel Eksekusi Order -->
            <div class="panel-box">
                <div class="tab-switch">
                    <div class="tab-btn buy active" id="btnBuyTab" onclick="switchTradeType('buy')">Beli</div>
                    <div class="tab-btn sell" id="btnSellTab" onclick="switchTradeType('sell')">Jual</div>
                </div>

                <div class="input-group">
                    <label>Harga (USDT)</label>
                    <div class="input-box"><input type="text" id="tradePrice" value="1.5000" readonly></div>
                </div>

                <div class="input-group">
                    <label>Jumlah FARA</label>
                    <div class="input-box"><input type="number" id="tradeAmount" placeholder="0"></div>
                </div>

                <div style="font-size: 0.7em; color: #888; margin-bottom: 8px;">
                    Saldo USDT: <span style="color:#00ffcc;" id="userUsdtBalance">0.00</span>
                </div>

                <button class="action-btn buy" id="executeTradeBtn" onclick="executeTrade()">Beli FARA</button>
            </div>

            <!-- Order Book Singkat -->
            <div class="panel-box">
                <div style="font-size: 0.8em; font-weight: bold; color: #888; margin-bottom: 6px;">Order Book</div>
                <div style="margin-bottom: 8px;">
                    <div class="orderbook-item" style="color: #ff4d4d;"><span>1.5250</span><span>10K</span></div>
                    <div class="orderbook-item" style="color: #ff4d4d;"><span>1.5120</span><span>25K</span></div>
                </div>
                <div style="text-align: center; font-weight: bold; color: #00ff88; font-size: 0.9em; padding: 4px 0; border-top: 1px solid #2a2a2a; border-bottom: 1px solid #2a2a2a; margin-bottom: 8px;">
                    1.5000 USDT
                </div>
                <div>
                    <div class="orderbook-item" style="color: #00ff88;"><span>1.4880</span><span>12K</span></div>
                    <div class="orderbook-item" style="color: #00ff88;"><span>1.4750</span><span>50K</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Navigasi Bawah -->
    <div class="bottom-nav">
        <a href="/" class="nav-item"><div>🏠</div><span>Home</span></a>
        <a href="/trading" class="nav-item active"><div>📊</div><span>Trading</span></a>
        <a href="/reels" class="nav-item"><div>🔥</div><span>Reels</span></a>
        <a href="/wallet" class="nav-item"><div>👛</div><span>Wallet</span></a>
        <a href="/profile" class="nav-item"><div>👤</div><span>Profile</span></a>
    </div>

    <script>
        let currentMode = 'buy';
        let userWalletData = JSON.parse(localStorage.getItem('fafiUserWallet')) || {
            faraBalance: 1500.00,
            usdtBalance: 250.00
        };

        function saveUserData() {
            localStorage.setItem('fafiUserWallet', JSON.stringify(userWalletData));
        }

        function updateUI() {
            document.getElementById('userUsdtBalance').innerText = userWalletData.usdtBalance.toFixed(2);
        }

        function switchTradeType(type) {
            currentMode = type;
            const btnBuy = document.getElementById('btnBuyTab');
            const btnSell = document.getElementById('btnSellTab');
            const execBtn = document.getElementById('executeTradeBtn');

            if(type === 'buy') {
                btnBuy.classList.add('active');
                btnSell.classList.remove('active');
                execBtn.classList.remove('sell');
                execBtn.classList.add('buy');
                execBtn.innerText = 'Beli FARA';
            } else {
                btnSell.classList.add('active');
                btnBuy.classList.remove('active');
                execBtn.classList.remove('buy');
                execBtn.classList.add('sell');
                execBtn.innerText = 'Jual FARA';
            }
        }

        function executeTrade() {
            let amount = parseFloat(document.getElementById('tradeAmount').value);
            let price = parseFloat(document.getElementById('tradePrice').value);

            if(!amount || amount <= 0) {
                alert('Silakan masukkan jumlah FARA yang valid.');
                return;
            }

            let totalCost = amount * price;

            if(currentMode === 'buy') {
                if(userWalletData.usdtBalance < totalCost) {
                    alert('❌ Saldo USDT tidak mencukupi untuk pembelian ini.');
                    return;
                }
                userWalletData.usdtBalance -= totalCost;
                userWalletData.faraBalance += amount;
                alert(`✅ Berhasil Membeli ${amount} FARA seharga ${totalCost.toFixed(2)} USDT!`);
            } else {
                if(userWalletData.faraBalance < amount) {
                    alert('❌ Saldo FARA tidak mencukupi untuk penjualan ini.');
                    return;
                }
                userWalletData.faraBalance -= amount;
                userWalletData.usdtBalance += totalCost;
                alert(`✅ Berhasil Menjual ${amount} FARA senilai ${totalCost.toFixed(2)} USDT!`);
            }

            saveUserData();
            updateUI();
            document.getElementById('tradeAmount').value = '';
        }

        // Render Grafik Candlestick Mini
        function renderCandles() {
            const container = document.getElementById('candleContainer');
            let html = '';
            let heights = [40, 55, 30, 70, 60, 85, 45, 90, 75, 65, 95, 80, 110, 100, 120];
            heights.forEach((h, idx) => {
                let type = (idx % 3 === 0) ? 'red' : 'green';
                html += `<div class="candle ${type}" style="height: ${h}px;"></div>`;
            });
            container.innerHTML = html;
        }

        window.onload = function() {
            updateUI();
            renderCandles();
        };
    </script>
</body>
</html>
