<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Gift FAFI</title>
    <!-- Jalur CSS disesuaikan jika berada di folder yang sama -->
    <link rel="stylesheet" href="./gift-modal.css">
</head>
<body>

    <!-- Tombol Buka Pop-up -->
    <button id="openGiftBtn" class="gift-trigger-btn">🎁 Buka Gift FAFI</button>

    <!-- Overlay & Container Pop-up -->
    <div id="fafiGiftModal" class="fafi-modal-overlay" style="display: none;">
        <div class="fafi-modal-content">
            <div class="modal-header">
                <span class="modal-title">Kirim Hadiah FAFI</span>
                <button id="closeGiftBtn" class="close-btn">&times;</button>
            </div>

            <!-- Grid Katalog (Di-generate otomatis via JS) -->
            <div class="gift-grid-container" id="giftGrid"></div>

            <div class="modal-footer">
                <div class="user-balance">🟡 <span id="faraBalance">0.00</span> FARA</div>
                <button class="topup-btn" onclick="location.href='/deposit.js'">Isi Ulang</button>
            </div>
        </div>
    </div>

    <!-- Script Utama Modal -->
    <script type="module">
        import { setupGiftModal } from './js/gift-data.js';

        const modal = document.getElementById('fafiGiftModal');
        const openBtn = document.getElementById('openGiftBtn');
        const closeBtn = document.getElementById('closeGiftBtn');

        openBtn.addEventListener('click', () => {
            modal.style.display = 'flex';
            setupGiftModal('giftGrid'); // Render grid gift saat modal dibuka
        });

        closeBtn.addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
